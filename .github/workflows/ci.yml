name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Install audio conversion dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check frontend/app.js

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag japanese-tts-web:ci .

      - name: Verify offline startup and restart
        run: |
          docker run -d --name tts-ci --network none japanese-tts-web:ci
          for attempt in $(seq 1 20); do
            if docker exec tts-ci /app/.venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec tts-ci /app/.venv/bin/python -c "import urllib.request; assert b'<!DOCTYPE html>' in urllib.request.urlopen('http://127.0.0.1:8000/').read()"
          docker restart tts-ci
          for attempt in $(seq 1 20); do
            if docker exec tts-ci /app/.venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec tts-ci /app/.venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs tts-ci || true
          docker rm -f tts-ci || true
