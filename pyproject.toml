[project]
name = "japanese-tts-web"
version = "0.1.0"
description = "Simple, high-quality Japanese Text-to-Speech Web application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "google-genai>=2.0.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1",
    "cachetools>=5.3.0",
    "edge-tts>=7.2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
