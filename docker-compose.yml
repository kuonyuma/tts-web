services:
  tts-web:
    build: .
    container_name: tts-web
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      COPILOT_AUTH_MODE: ${COPILOT_AUTH_MODE:-development}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      REDIS_URL: ${REDIS_URL:-}
      EDGE_TTS_MAX_CONCURRENCY: ${EDGE_TTS_MAX_CONCURRENCY:-3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERVER_KEY_ACCESS_TOKEN: ${SERVER_KEY_ACCESS_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-1000}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-30}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.8-flash}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-flash}
      GLM_TEXT_MODEL: ${GLM_TEXT_MODEL:-glm-5.3-flash}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen3.7-flash-2026-07-15}
      QWEN_API_REGION: ${QWEN_API_REGION:-cn}
      COPILOT_DEFAULT_MODEL: ${COPILOT_DEFAULT_MODEL:-deepseek-flash}
      COPILOT_ENABLED_MODELS: ${COPILOT_ENABLED_MODELS:-deepseek-flash,qwen-3.7-flash}
      COPILOT_ENABLE_UNVERIFIED_GLM53: ${COPILOT_ENABLE_UNVERIFIED_GLM53:-false}
      COPILOT_PROMPT_VERSION: ${COPILOT_PROMPT_VERSION:-2026-09-v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-5}
      LLM_RESPONSE_MAX_BYTES: ${LLM_RESPONSE_MAX_BYTES:-1048576}
      DEEPSEEK_MAX_CONCURRENCY: ${DEEPSEEK_MAX_CONCURRENCY:-3}
      ZHIPU_MAX_CONCURRENCY: ${ZHIPU_MAX_CONCURRENCY:-3}
      QWEN_MAX_CONCURRENCY: ${QWEN_MAX_CONCURRENCY:-3}
      COPILOT_USER_MINUTE_UNITS: ${COPILOT_USER_MINUTE_UNITS:-20}
      COPILOT_USER_DAILY_UNITS: ${COPILOT_USER_DAILY_UNITS:-200}
      COPILOT_GLOBAL_DAILY_UNITS: ${COPILOT_GLOBAL_DAILY_UNITS:-10000}
      MIN_TEXT_LENGTH: ${MIN_TEXT_LENGTH:-1}
      QUEUE_TIMEOUT_SECONDS: ${QUEUE_TIMEOUT_SECONDS:-5}
      GEMINI_MAX_CONCURRENCY: ${GEMINI_MAX_CONCURRENCY:-3}
      MAX_PENDING_REQUESTS: ${MAX_PENDING_REQUESTS:-16}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-16384}
      REQUEST_BODY_TIMEOUT_SECONDS: ${REQUEST_BODY_TIMEOUT_SECONDS:-10}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
      GLOBAL_REQUESTS_PER_MINUTE: ${GLOBAL_REQUESTS_PER_MINUTE:-600}
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-536870912}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1000}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-604800}
      CACHE_MIN_FREE_BYTES: ${CACHE_MIN_FREE_BYTES:-67108864}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-16777216}
      MEMORY_CACHE_MAX_BYTES: ${MEMORY_CACHE_MAX_BYTES:-33554432}
      DB_BUSY_TIMEOUT_SECONDS: ${DB_BUSY_TIMEOUT_SECONDS:-0.5}
      DB_MAX_BYTES: ${DB_MAX_BYTES:-134217728}
      HISTORY_MAX_RECORDS: ${HISTORY_MAX_RECORDS:-10000}
      EXPLANATION_MAX_RECORDS: ${EXPLANATION_MAX_RECORDS:-1000}
    volumes:
      - ./backend/app/cache:/app/backend/app/cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
